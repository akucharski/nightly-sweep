<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Nightly Sweep</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #5c6570; --line: #e3e6ea; --field: #7d8590;
    --accent: #2158b8; --btn: #2563c9; --focus: #2563c9;
    --bad: #a8291f; --bad-bg: #fbe7e5; --ok: #1a7340; --ok-bg: #e6f4ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --ink: #e6e9ed; --muted: #9da5ae; --line: #262c34; --field: #6e7681;
      --accent: #8ab4ff; --focus: #8ab4ff; --bad: #f0716a; --bad-bg: #331a19; --ok: #4cc283; --ok-bg: #15291e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; padding: 16px; }
  main { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
  input { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--field);
          border-radius: 6px; padding: 10px 12px; }
  input[aria-invalid="true"] { border-color: var(--bad); border-width: 2px; }
  button, .google { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; font: inherit; font-weight: 600;
                    border-radius: 6px; padding: 11px 16px; cursor: pointer; margin-top: 20px; text-decoration: none; min-height: 44px; }
  button { background: var(--btn); color: #fff; border: 0; }
  .google { background: var(--panel); color: var(--ink); border: 1px solid var(--field); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 22px 0 0; }
  .or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--field); }
  .msg { border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 8px; }
  .msg.error { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad); }
  .msg.notice { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
  .msg:focus { outline: 3px solid var(--focus); outline-offset: 2px; }
  .setup { font-size: 14px; color: var(--muted); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--bg);
         border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; overflow-wrap: anywhere; }
  footer { margin-top: 22px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Nightly site sweep</h1>
  <p class="sub">Sign in to continue. This dashboard only reads public pages and never changes a site.</p>
  {{MESSAGE}}
  {{FORM}}
  {{GOOGLE}}
  {{SETUP}}
  <footer>Locked out? An admin can reset access from the command line with <code>manage.py</code>.</footer>
</main>
<script>
  // Move focus to an error or notice so screen readers announce it straight away.
  const m = document.querySelector(".msg"); if (m) m.focus();
</script>
</body>
</html>
